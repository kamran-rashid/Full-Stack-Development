  <rect width="1200" height="420" fill="#16304f"/>
  <g stroke="#efe8d8" stroke-opacity=".08" stroke-width="2">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
  </g>
  <path d="M0 340 L120 315 240 328 360 262 480 280 600 205 720 226 840 150 960 172 1080 92 1200 108 V420 H0Z" fill="#1f8a70" fill-opacity=".38"/>
  <path d="M0 340 L120 315 240 328 360 262 480 280 600 205 720 226 840 150 960 172 1080 92 1200 108" fill="none" stroke="#d9a21b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
